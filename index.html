<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-Step Equations</title>
<style>
  :root{
    --ink:#0f172a; --line:#1e293b; --muted:#64748b; --faint:#94a3b8;
    --blue:#1d4ed8; --blue-b:#3b82f6; --blue-bg:#eff6ff;
    --green:#059669; --green-bg:#ecfdf5;
    --rose:#e11d48; --rose-bg:#fff1f2;
    --page:#f8fafc; --edge:#e2e8f0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  /* scale everything with the screen so the problem fills it */
  html{font-size:clamp(16px,1.15vw + .6vh,26px);}
  body{
    background:var(--page); color:var(--ink);
    font-family:Tahoma,Verdana,Geneva,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding:12px 16px;}
  .wrap{width:100%;max-width:64rem;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0;}

  /* work area */
  .ghost{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none;width:max-content;}
  .work{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        justify-content:safe center;padding:6px 0;overflow:hidden;}
  /* the equation and the panel under it scale together as one block, so the
     size is set once per problem and nothing shifts underfoot mid-solve */
  .stagebox{display:flex;justify-content:center;align-items:flex-start;flex-shrink:0;}
  /* the working on the left, the buttons and the check beside it */
  .stage{display:flex;flex-direction:row;align-items:flex-start;gap:3rem;transform-origin:top center;}
  .stage-main{display:flex;justify-content:center;}
  .stage-side{display:flex;flex-direction:column;align-items:center;gap:1.4rem;}
  /* tall, narrow screens: stack the two columns instead */
  @media (max-aspect-ratio:1/1){ .stage{flex-direction:column;align-items:center;gap:18px;} }

  .scroller{display:flex;justify-content:center;}
  .scroller > .eq{flex:0 0 auto;}
  .eq{display:grid;column-gap:30px;row-gap:10px;width:max-content;margin:0 auto;
      font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:2.4rem;}
  /* two-step needs both shapes at once: four columns for the line that still
     carries a constant, and room for a fraction bar on the line below it */
  .eq.k-two{grid-template-columns:auto auto auto auto;row-gap:10px;column-gap:26px;}
  .eq.k-two .cell{gap:10px;min-height:3.4rem;}
  .cell.span2{grid-column:span 2;}
  .eq.k-two .dfrac{font-size:1em;}
  .eq.k-two .dfrac > .t,.eq.k-two .dfrac > .b{padding:0 8px;gap:.28em;}
  .eq.k-two .dfrac > .bar{min-width:4.2rem;border-top-color:var(--line);}
  .eq.k-two .mgroup{gap:6px;}
  .eq.k-two .mgroup.tall .paren{font-size:2.2em;}
  /* room above and below for the cancelled numbers, without wasting a whole line */
  .eq.k-two .mgroup.roomy{padding:1.8rem 0;}
  .cell{min-height:4rem;padding:2px 0;display:flex;align-items:center;justify-content:center;gap:6px;
        transition:opacity .7s ease-out;}
  .rule{grid-column:1 / -1;height:2px;margin:5px 0;border-top:2px solid var(--line);}
  /* same row break as .rule, but with no line drawn: nothing is being summed */
  .spacer{grid-column:1 / -1;height:0;margin:9px 0;}
  .hide{visibility:hidden;}
  .eqsign{color:var(--faint);}
  .blue{color:var(--blue);}
  .green{color:var(--green);}
  .grey{color:var(--muted);}
  .faint{color:var(--faint);}
  .cancelling{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6;}
  .struck{text-decoration:line-through;text-decoration-thickness:2px;opacity:.25;}

  .num{display:inline-flex;align-items:center;vertical-align:middle;}
  .sgn{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}

  /* full-size fractions, used when multiplying and dividing */
  .dfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
         line-height:1.15;margin:0 1px;font-size:.86em;}
  .dfrac > .t,.dfrac > .b{padding:0 7px;display:flex;align-items:center;justify-content:center;}
  .dfrac > .bar{width:100%;min-width:1.4rem;border-top:2px solid currentColor;margin:4px 0;}
  .dfrac.grow{animation:grow .35s ease-out;}

  /* the reciprocal the student writes: two boxes stacked over a bar */
  .fracbox{display:inline-flex;flex-direction:column;align-items:center;gap:4px;vertical-align:middle;}
  .fracbox > .bar{width:112%;border-top:2px solid var(--line);}

  /* diagonal cancel stroke, drawn corner to corner so it fits whatever it crosses */
  .slash{position:relative;display:inline-flex;align-items:center;justify-content:center;
         padding:0 .18em;background-repeat:no-repeat;background-position:center;background-size:100% 100%;
         background-image:linear-gradient(to bottom right,
           transparent calc(50% - 1.8px), var(--sl) calc(50% - 1.8px),
           var(--sl) calc(50% + 1.8px), transparent calc(50% + 1.8px));}
  .slash.draw{--sl:#475569;color:#94a3b8;animation:draw .5s ease-out both;}
  .slash.dim{--sl:#a3aec0;color:#cbd5e1;}
  .slash.cross{--sl:#64748b;color:#9aa7bb;}
  /* a number waiting to be simplified: same box as .slash, but no stroke yet */
  .pend{display:inline-flex;align-items:center;justify-content:center;padding:0 .18em;}

  /* cross-simplifying: the reduced number is written above or below the crossed-out one
     without shifting it, so the originals keep their place on the line */
  .cx{position:relative;display:inline-flex;align-items:center;justify-content:center;}
  .cx .redu{position:absolute;left:50%;transform:translateX(-50%);
            display:flex;align-items:center;justify-content:center;
            color:var(--blue);font-size:.66em;line-height:1;}
  .cx.above .redu{bottom:100%;margin-bottom:3px;}
  .cx.below .redu{top:100%;margin-top:3px;}

  /* parenthesised group: multiplying both sides */
  .mgroup{display:inline-flex;align-items:center;gap:9px;}
  .paren{font-size:1.35em;line-height:1;color:var(--line);}
  .mgroup.tall .paren{font-size:2.6em;font-weight:300;}
  .mgroup.fade{animation:grow .35s ease-out;}
  @keyframes grow{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  @keyframes draw{from{background-size:0% 100%;}to{background-size:100% 100%;}}

  /* inputs */
  .box{height:2.9rem;width:3.9rem;border:2px solid var(--blue-b);background:var(--blue-bg);color:var(--blue);
       border-radius:6px;text-align:center;font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:1.9rem;
       outline:none;transition:border-color .15s,background .15s;}
  .box.wide{width:5.4rem;}
  .box.small{font-size:1.4rem;}
  .box.mini{height:2.4rem;width:3.4rem;font-size:1.4rem;}
  .box.tiny{height:1.9rem;width:2.6rem;font-size:1.1rem;border-radius:5px;}
  .box:focus{border-color:var(--blue);background:#fff;}
  .box.bad{border-color:#fb7185;background:var(--rose-bg);color:var(--rose);}
  .box.ok{border-color:#10b981;background:var(--green-bg);color:var(--green);}
  .preview{color:var(--faint);}

  /* operation buttons */
  .ops{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;}
  .op{width:5.6rem;height:4.4rem;border:2px solid var(--edge);background:#fff;color:var(--line);
      border-radius:12px;cursor:pointer;font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:2.3rem;
      line-height:1;display:flex;align-items:center;justify-content:center;
      transition:border-color .15s,background .15s,transform .1s;}
  .op:hover{border-color:var(--blue-b);background:var(--blue-bg);color:var(--blue);}
  .op:active{transform:translateY(1px);}
  .op:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px;}
  .op.shake{animation:shake .32s;border-color:#fb7185;background:var(--rose-bg);color:var(--rose);}
  /* the key that picks this move, in the corner of the button */
  .op{position:relative;}
  .op .key{position:absolute;right:7px;bottom:5px;font-size:.8rem;line-height:1;color:var(--faint);}
  /* a typed key flashes its button the way a click would */
  .op.kbd{border-color:var(--blue-b);background:var(--blue-bg);color:var(--blue);transform:translateY(1px);}
  /* first part of each move: click the part of the equation that's in the way */
  .tgt{display:inline-flex;align-items:center;justify-content:center;gap:inherit;padding:2px 8px;
       border-radius:10px;transition:border-color .15s,background .15s,color .15s;}
  /* a number stuck to its variable (3w): keep the two together, highlight space only on the outside */
  .tpair{display:inline-flex;align-items:center;}
  .tpair > .tgt:first-child{padding-right:1px;}
  .tpair > .tgt:last-child{padding-left:1px;}
  .tgt[role=button]{cursor:pointer;}
  .tgt[role=button]:hover{background:#fef9c3;}
  .tgt[role=button]:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px;}
  .tgt.picked{background:#fde047;color:var(--ink);}
  .tgt.shake{animation:shake .32s;background:var(--rose-bg);color:var(--rose);}
  @keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  .checkline{width:100%;text-align:center;font-family:Tahoma,Verdana,Geneva,sans-serif;font-size:1.7rem;line-height:2.1;}
  .checkline .orig{color:var(--faint);}
  .checkline .sub{margin-top:12px;}

  /* prompt bar */
  /* fixed height on purpose: a message appearing must not change how much
     room the equation has, or the writing would resize mid-problem */
  .promptbar{flex-shrink:0;border-top:1px solid var(--edge);padding-top:12px;padding-bottom:4px;
             height:5rem;overflow-y:auto;}
  .prompt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:#334155;font-size:1.35rem;}
  .prompt .math{font-family:Tahoma,Verdana,Geneva,sans-serif;}
  .prompt strong{font-weight:600;}
  .hintline{width:100%;font-size:.85rem;color:#475569;display:flex;flex-wrap:wrap;align-items:center;gap:5px;}
  .missline{margin-top:4px;font-size:1.05rem;color:var(--rose);}
  .noteline{margin-top:4px;font-size:1.05rem;color:var(--muted);}
  .next{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:12px 24px;
        font-size:1.1rem;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .next:hover{background:#1e293b;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;}

  @media (max-width:640px){
    .eq{font-size:1.45rem;column-gap:15px;}
    .eq.k-two{font-size:1.3rem;column-gap:13px;row-gap:7px;}
    .eq.k-two .cell{min-height:2.7rem;gap:7px;}
    .eq.k-two .dfrac > .bar{min-width:2.6rem;}
    .eq.k-two .mgroup.roomy{padding:1.1rem 0;}
    .cell{min-height:3.1rem;}
    .checkline{font-size:1.15rem;line-height:1.9;}
    .ops{gap:9px;}
    .op{width:4rem;height:3.4rem;font-size:1.7rem;}
    .box{height:2.3rem;width:3.1rem;font-size:1.3rem;}
    .box.wide{width:4.4rem;}
    .box.mini{height:2rem;width:2.8rem;font-size:1.15rem;}
    .box.tiny{height:1.6rem;width:2.1rem;font-size:.95rem;}
    .prompt{font-size:1.1rem;}
    .promptbar{height:5.6rem;}
    .stage{flex-direction:column;align-items:center;gap:18px;}
  }
  @media (prefers-reduced-motion:reduce){
    .dfrac.grow,.mgroup.fade,.op.shake,.slash.draw{animation:none;}
  }

  /* ---------- problem counter + turn in ---------- */
  .drillhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;
    flex-shrink:0;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--edge);}
  .dh-name{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}
  .dh-right{display:inline-flex;align-items:center;gap:12px;}
  .dh-count{font-size:1rem;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .turnin-link{font-family:inherit;font-weight:700;font-size:.75rem;padding:4px 12px;border-radius:8px;cursor:pointer;
    background:#fff;color:var(--blue);border:2px solid #bfdbfe;}
  .turnin-link:hover{border-color:#93c5fd;background:var(--blue-bg);}
  .off{display:none !important;}

  /* ---------- the turn-in page ---------- */
  .turnin{position:fixed;inset:0;z-index:100;overflow:auto;background:#f4f6f9;font-size:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:600;color:#1a202c;
    -webkit-user-select:text;user-select:text;}
  .turnin button{font-family:inherit;font-weight:800;border-radius:10px;cursor:pointer;border:none;transition:background .2s;}
  .turnin button:focus-visible{outline:3px solid #1a365d;outline-offset:3px;}
  .check-btn{color:#fff;background-color:#2b6cb0;padding:12px 30px;font-size:1.1em;}
  .check-btn:hover{background-color:#2c5282;}
  .ti-inner{max-width:640px;margin:clamp(12px,4vh,40px) auto;padding:28px clamp(18px,4vw,36px) 32px;
    background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);}
  .ti-inner h2{color:#1a365d;font-size:1.6em;font-weight:800;margin:0 0 20px;letter-spacing:-.01em;}
  .ti-inner h3{color:#1a365d;font-size:1.05em;font-weight:800;margin:26px 0 10px;}
  .ti-sub{color:#718096;font-weight:600;line-height:1.55;margin:0 0 20px;}
  .ti-recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .ti-recap > div{border:2px solid #e2e8f0;border-radius:12px;padding:10px 14px;color:#718096;font-size:.85em;}
  .ti-recap b{display:block;color:#1a202c;font-size:1.9em;font-weight:800;}
  .ti-log{max-height:320px;overflow:auto;margin-top:16px;padding:6px 0;border-top:2px solid #e2e8f0;border-bottom:2px solid #e2e8f0;}
  .ti-empty{color:#a0aec0;margin-top:14px;}
  .ti-row{display:flex;gap:10px;align-items:baseline;padding:5px 2px;font-size:1.02em;}
  .ti-n{color:#a0aec0;min-width:28px;text-align:right;font-size:.85em;}
  .ti-q{flex:1;min-width:0;overflow-wrap:anywhere;}
  .ti-arrow{color:#a0aec0;padding:0 4px;}
  .ti-k{font-size:.8em;white-space:nowrap;color:#38a169;}
  .ti-k.retry{color:#dd6b20;}
  #gform{margin-top:4px;}
  .ti-warn{background:#fefcbf;color:#744210;border-radius:10px;padding:11px 14px;margin-bottom:18px;line-height:1.55;font-size:.92em;}
  .ti-field{margin-bottom:14px;}
  .ti-field label{display:block;margin-bottom:6px;color:#2d3748;}
  .ti-field label em{font-style:normal;color:#a0aec0;font-weight:600;font-size:.88em;}
  .ti-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:8px;
    border-radius:50%;background:#2b6cb0;color:#fff;font-size:.8em;}
  .ti-field input{font-family:inherit;font-size:1.05em;font-weight:700;color:#1a202c;width:100%;
    border:2px solid #cbd5e0;border-radius:10px;padding:9px 12px;background:#fff;}
  .ti-field input:focus{outline:none;border-color:#3182ce;}
  .ti-check{border:2px solid #e2e8f0;border-radius:12px;padding:11px 14px;margin:4px 0 16px;background:#f7fafc;}
  .ti-check .head{color:#718096;font-size:.88em;margin-bottom:8px;}
  .ti-check .row{display:flex;gap:12px;align-items:baseline;margin-bottom:4px;}
  .ti-check .row:last-child{margin-bottom:0;padding-top:6px;border-top:2px solid #e2e8f0;}
  .ti-check .t{color:#a0aec0;min-width:88px;font-size:.85em;}
  .ti-check .v{color:#1a202c;}
  .ti-check .v.empty{color:#cbd5e0;}
  .ti-feedback{margin-top:14px;min-height:1.2em;}
  .ti-feedback .ok{color:#2f855a;}
  .ti-feedback .note{color:#718096;}
  .ti-after{margin-top:20px;padding-top:16px;border-top:2px solid #e2e8f0;display:flex;gap:12px;align-items:center;
    flex-wrap:wrap;color:#718096;}
  .ti-ghost{background:#edf2f7;color:#2d3748;padding:8px 16px;font-size:.95em;}
  .ti-ghost:hover{background:#e2e8f0;}
</style>
</head>
<body>
<div class="app">
  <div class="wrap">
    <div class="drillhead">
      <span class="dh-name">Two-Step Equations</span>
      <span class="dh-right"><span class="dh-count" id="problem-title">Problem 1 of 10</span><button class="turnin-link" id="turnin-link" type="button">Turn in</button></span>
    </div>

    <div class="work">
      <div class="stagebox" id="stagebox">
        <div class="stage" id="stage">
          <div class="stage-main" id="stageMain">
            <div class="scroller"><div class="eq" id="eq"></div></div>
          </div>
          <div class="stage-side" id="stageSide">
            <div id="panel"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="promptbar" id="promptbar"></div>
  </div>
</div>

<!-- offscreen: a finished copy of the problem is drawn here and measured, so the
     real one can be sized once and left alone -->
<div class="ghost" id="ghost" aria-hidden="true"></div>

<!-- the turn-in page: after problem 10, or any time from the Turn in button -->
<div class="turnin off" id="turnin" role="dialog" aria-labelledby="ti-title">
  <div class="ti-inner">
    <h2 id="ti-title">All 10 done</h2>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none"
            onload="if(window.onHiddenFrameLoad)onHiddenFrameLoad()"></iframe>

    <form action="https://docs.google.com/forms/d/e/1FAIpQLSe4_Gnrq1zyrttA3lSgrVBtMkaVaoMim31ByzoH-orxmfDB2A/formResponse"
          method="POST" target="hidden_iframe" id="gform">
      <div class="ti-field">
        <label for="studentPeriod"><span class="ti-num">1</span>Period</label>
        <input type="number" id="studentPeriod" placeholder="e.g. 3" min="1" max="10" required>
      </div>
      <div class="ti-field">
        <label for="lastName"><span class="ti-num">2</span>LAST name
          <em>&mdash; your family name, the one the roster is alphabetized by</em></label>
        <input type="text" id="lastName" placeholder="Rodriguez" autocomplete="family-name" required>
      </div>
      <div class="ti-field">
        <label for="firstName"><span class="ti-num">3</span>FIRST name
          <em>&mdash; the name your teacher calls you by</em></label>
        <input type="text" id="firstName" placeholder="Maria" autocomplete="given-name" required>
      </div>
      <div class="ti-check" id="nameCheck"></div>
      <input type="hidden" id="studentName" name="entry.1899284808" value="">
      <input type="hidden" id="formScore" name="entry.1974610095" value="">
      <button type="submit" class="check-btn" id="ti-submit">Submit Results</button>
    </form>

    <div class="ti-feedback" id="ti-feedback"></div>
    <div class="ti-after">
      <span id="ti-after-lab">Want more practice?</span>
      <button class="ti-ghost" type="button" id="ti-back">Keep practicing</button>
    </div>

    <h3>Your work</h3>
    <div class="ti-recap" id="ti-recap"></div>
    <div id="ti-log"></div>
  </div>
</div>

<script>

/* ============ shell: one score, mixed dealing, router ============ */
const Shell = {
  done:0, streak:0, active:null, activeEng:null, bag:[], lastKind:null, engines:{}, timers:[],
  counts:{basic:0, negfrac:0, fcoef:0},

  /* the three kinds of two-step problem, dealt in equal amounts */
  kinds:[
    {id:"basic",   eng:"two", arg:"basic"},
    {id:"negfrac", eng:"two", arg:"negfrac"},
    {id:"fcoef",   eng:"two", arg:"fcoef"}
  ],
  kind:function(id){
    const ks=Shell.kinds;
    for(let i=0;i<ks.length;i++) if(ks[i].id===id) return ks[i];
    return ks[0];
  },

  later:function(ms,fn){ Shell.timers.push(setTimeout(fn,ms)); },
  clearTimers:function(){ Shell.timers.forEach(clearTimeout); Shell.timers=[]; },

  /* One size per problem. The engine works out a scale from the FINISHED
     problem before the first line is drawn, and that scale is held for every
     step, so the writing never changes size while the student is working. */
  scale:1,
  applyScale:function(){
    const stage=document.getElementById("stage");
    if(!stage) return;
    const box=stage.parentNode, s=Shell.scale;
    stage.style.transform = Math.abs(s-1)<0.001 ? "none" : "scale("+s+")";
    /* each column keeps its finished width, so nothing slides sideways as lines appear */
    const main=document.getElementById("stageMain"), side=document.getElementById("stageSide");
    if(main) main.style.minWidth = Shell.mainW ? Shell.mainW+"px" : "";
    if(side) side.style.minWidth = Shell.sideW ? Shell.sideW+"px" : "";
    /* hold the room for the finished problem from the first step on */
    box.style.height=Math.ceil(Math.max(stage.offsetHeight, Shell.stageH||0)*s)+"px";
  },
  /* how much room the whole stage has to fit into */
  room:function(){
    const work=document.querySelector(".work");
    const cs=getComputedStyle(work);
    const pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
    return {h:work.clientHeight-pad, w:work.clientWidth};
  },
  /* measure a finished problem off-screen without disturbing the live one */
  ghost:function(html){
    const g=document.getElementById("ghost");
    g.innerHTML=html;
    const out=[].map.call(g.children,function(c){
      return {w:c.offsetWidth, h:c.offsetHeight};
    });
    g.innerHTML="";
    return out;
  },
  /* re-measure only when the box around the equation actually changes size */
  watchFit:function(){
    let queued=false;
    const go=function(){
      if(queued) return;
      queued=true;
      requestAnimationFrame(function(){
        queued=false;
        if(Shell.onResize) Shell.onResize();
      });
    };
    window.addEventListener("resize",go);
    if(window.ResizeObserver){
      const ro=new ResizeObserver(go);
      ro.observe(document.querySelector(".work"));
    }
  },

  head:function(){
    document.getElementById("eq").className = "eq k-two";
  },
  solved:function(clean,info){
    TI.record(clean,info);
    Shell.done++;
    Shell.streak = clean ? Shell.streak+1 : 0;
    if(Shell.active && Shell.counts[Shell.active]!==undefined) Shell.counts[Shell.active]++;
  },

  /* the same four moves on every problem: press one (or type its key), then type the number */
  OPS:[
    ["opPlus", "add",      "+",         "Add to both sides",        "+", "A"],
    ["opMinus","sub",      "\u2212",    "Subtract from both sides", "\u2212", "S"],
    ["opMul",  "multiply", "(\u2009)",  "Multiply both sides",      "x", "M"],
    ["opDiv",  "divide",   "\u00f7",    "Divide both sides",        "/", "D"]
  ],
  /* keys that choose each move: the plain keys, the number-pad keys, and look-alikes */
  KEYS:{
    "+":"opPlus", "=":"opPlus",
    "-":"opMinus", "\u2212":"opMinus", "_":"opMinus",
    "x":"opMul", "X":"opMul", "*":"opMul", "\u00d7":"opMul", "(":"opMul", ")":"opMul",
    "/":"opDiv", "\u00f7":"opDiv",
    "a":"opPlus", "A":"opPlus", "s":"opMinus", "S":"opMinus",
    "m":"opMul", "M":"opMul", "d":"opDiv", "D":"opDiv"
  },
  opsHTML:function(){
    return '<div class="ops">'+Shell.OPS.map(function(o){
      return '<button class="op" id="'+o[0]+'" aria-label="'+o[3]+'" aria-keyshortcuts="'+o[4]+' '+o[5]+'"'
           + ' title="'+o[3]+' (type '+o[4]+' or '+o[5]+')">'+o[2]+'<span class="key">'+o[5]+'</span></button>';
    }).join("")+'</div>';
  },
  /* typing + \u2212 x / while the buttons are showing presses that button */
  keyOp:function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(TI.isOpen()) return;
    const a=document.activeElement;
    if(a && ((a.tagName==="INPUT" && a.type!=="checkbox")||a.tagName==="TEXTAREA")) return;
    const id=Shell.KEYS[e.key];
    const btn=id && document.getElementById(id);
    if(!btn) return;
    e.preventDefault();
    btn.classList.add("kbd");
    setTimeout(function(){ btn.classList.remove("kbd"); },180);
    btn.click();
  },
  bindOps:function(fn){
    Shell.OPS.forEach(function(o){
      const b=document.getElementById(o[0]);
      if(b) b.onclick=function(){ fn(o[1],b); };
    });
  },
  shake:function(btn){
    if(!btn) return;
    btn.classList.add("shake");
    Shell.later(340,function(){ btn.classList.remove("shake"); });
  },

  /* wrap a piece of the equation so it can be clicked (target step), or shown as the one picked */
  mark:function(phase,html,id,want){
    if(phase==="target") return '<span class="tgt" role="button" tabindex="0" data-t="'+id+'">'+html+'</span>';
    if(phase==="pick") return '<span class="tgt'+(id===want?" picked":"")+'">'+html+'</span>';
    return html;
  },
  bindTargets:function(fn){
    document.querySelectorAll('#eq .tgt[role=button]').forEach(function(t){
      const go=function(){ fn(t.getAttribute("data-t"),t); };
      t.onclick=go;
      t.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
    });
  },

  /* equal amounts: deal from a shuffled bag of the three kinds, so every three in a row has one of each */
  pickKind:function(){
    if(!Shell.bag.length){
      let b;
      do{
        b=Shell.kinds.map(function(k){return k.id;});
        for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
      }while(b[b.length-1]===Shell.lastKind);
      Shell.bag=b;
    }
    const k=Shell.bag.pop(); Shell.lastKind=k;
    return k;
  },
  nextLabel:function(){ return TI.nextLabel(); },

  next:function(){
    if(TI.isOpen()) return;
    if(TI.wantsTurnIn()){ TI.show(); return; }
    TI.newProblem();
    Shell.clearTimers();
    document.getElementById("panel").innerHTML="";
    const id=Shell.pickKind(), k=Shell.kind(id);
    Shell.active=id; Shell.activeEng=k.eng;
    Shell.engines[k.eng].start(k.arg);
  }
};

Shell.watchFit();
document.addEventListener("keydown",Shell.keyOp);


/* ================= two-step =================
   Every two-step problem is one "constant" move and one "coefficient" move.
   Normally the constant goes first; the wrapped form (x + 4)/5 = 3 needs the
   coefficient cleared first, so the two steps just swap roles.
   Each move starts by clicking the part of the equation that is in the way. */
Shell.engines["two"] = (function(){
const KEY="two";

/* ============ formatting ============ */
const MINUS="\u2212", TIMES="\u00d7", DIV="\u00f7";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function dash(s){return String(s).replace(/-/g,MINUS);}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}
/* a term written with its own sign in front:  + 5   or   \u2212 7 */
function sgnHTML(n){
  return '<span class="sgn">'+(n<0?MINUS:"+")+'<span>'+Math.abs(n)+'</span></span>';
}

/* ============ parsing ============ */
function parseInt2(raw){
  if(raw===null||raw===undefined) return null;
  const s=String(raw).trim().replace(/[\u2212\u2013\u2014]/g,"-").replace(/\s+/g,"");
  const m=s.match(/^([+-]?)(\d+)$/);
  if(!m) return null;
  return (m[1]==="-"?-1:1)*(+m[2]);
}

/* ============ problem generation ============ */
function rint(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
const VARS=["x","y","n","m","k","t","w","p","r","v","z","c"];

/* kind tells you what is attached to the variable, and so what the second move is:
     mul   3x       -> divide by 3
     div   x/4      -> multiply by 4
     frac  (2/3)x   -> multiply by 3/2
     wrap  (x+4)/5  -> multiply by 5 FIRST, then subtract 4
   M is what the number side is worth after step one; sol is the answer.      */
function tryGen(fl){
  const V=pick(VARS), varLeft=Math.random()<0.5;

  if(fl==="negfrac" && Math.random()<0.2){
    const a=rint(2,8), k=rint(2,12)*(Math.random()<0.4?-1:1), C=rint(-9,9);
    if(C===0) return null;
    const M=a*C, sol=M-k;
    if(sol===0 || Math.abs(sol)>60) return null;
    return {kind:"wrap", wrapped:true, V:V, a:a, num:0, den:0, s:1,
            k:k, C:C, M:M, sol:sol, varLeft:varLeft, varFirst:true};
  }

  let kind, a=0, num=0, den=0, s=1, M=0, sol=0;
  if(fl==="fcoef"){
    kind="frac";
    do{ num=rint(1,7); den=rint(2,9); }while(num>=den || gcd(num,den)!==1);
    s = Math.random()<0.35 ? -1 : 1;
    const t = rint(1,5)*(Math.random()<0.4?-1:1);
    sol = den*t; M = s*num*t;
  } else if(fl==="basic"){
    if(Math.random()<0.6){ kind="mul"; a=rint(2,9); sol=rint(2,12); M=a*sol; }
    else                 { kind="div"; a=rint(2,9); M=rint(2,12); sol=a*M; }
  } else {
    if(Math.random()<0.6){
      kind="mul"; a=rint(2,9)*(Math.random()<0.6?-1:1);
      sol=rint(2,12)*(Math.random()<0.45?-1:1); M=a*sol;
    } else {
      kind="div"; a=rint(2,9)*(Math.random()<0.6?-1:1);
      M=rint(2,10)*(Math.random()<0.45?-1:1); sol=a*M;
    }
  }
  if(M===0 || sol===0 || Math.abs(sol)>60 || Math.abs(M)>60) return null;

  const k = rint(2,15)*(Math.random()<(fl==="basic"?0.4:0.5) ? -1 : 1);
  const C = M+k;
  if(Math.abs(C)>75) return null;

  const varFirst = kind==="div" ? Math.random()<0.75 : Math.random()<0.62;
  return {kind:kind, wrapped:false, V:V, a:a, num:num, den:den, s:s,
          k:k, C:C, M:M, sol:sol, varLeft:varLeft, varFirst:varFirst};
}
function genProblem(fl){
  for(let i=0;i<600;i++){
    const p=tryGen(fl||"basic");
    if(p) return p;
  }
  return {kind:"mul",wrapped:false,V:"x",a:2,num:0,den:0,s:1,
          k:5,C:15,M:10,sol:5,varLeft:true,varFirst:true};
}

/* ============ state ============ */
const S={
  p:null, fl:"basic", phase:"target1", sign:1,
  opIn:"", coefIn:"", recN:"", recD:"", mIn:"", ansIn:"",
  simpDen:"", simpNum:"",
  miss:"", hint:false, clean:true, firstId:null
};
const clearTimers=Shell.clearTimers, later=Shell.later;

/* ============ where we are ============ */
const ORDER=["target1","pick1","op1","cancel1","simplify1","compute1",
             "target2","pick2","op2","cancel2","simplify2","compute2","solved","check"];
function idx(ph){return ORDER.indexOf(ph);}
function at(ph){return idx(S.phase)>=idx(ph);}
function past(ph){return idx(S.phase)>idx(ph);}
function stepNo(){return /\d$/.test(S.phase) ? +S.phase.slice(-1) : 0;}
function subName(){return stepNo() ? S.phase.slice(0,-1) : S.phase;}
function cs(){return S.p.wrapped?2:1;}          /* which step clears the constant */
function ks(){return S.p.wrapped?1:2;}          /* which step clears the coefficient */
function isConst(){return stepNo()===cs();}

/* what each move works on and what it produces */
function constIn(){return S.p.wrapped?S.p.M:S.p.C;}
function coefIn(){return S.p.wrapped?S.p.C:S.p.M;}

/* ---- clicking what's in the way ----
   ids:  k = the loose number,  a = what is attached to the variable,
         v = the variable,      c = the lone number on the other side   */
function wantT(step){ return step===cs() ? "k" : "a"; }
function tmode(step){
  return S.phase==="target"+step ? "target" : (S.phase==="pick"+step ? "pick" : "");
}
function marker(step){
  const m=tmode(step), w=wantT(step);
  return function(h,id){ return Shell.mark(m,h,id,w); };
}
function plain(h){ return h; }

/* ---- cross-simplifying, set up exactly as the one-step fraction drill does it. */
function gFac(){return gcd(S.p.num, Math.abs(coefIn()));}
function canSimp(){return S.p.kind==="frac" && gFac()>1;}
function redDen(){return S.p.num/gFac();}
function redNum(){return coefIn()/gFac();}
function simpPhase(){return "simplify"+ks();}
function simplifying(){return S.phase===simpPhase();}
function simpDenOK(){return parseInt2(S.simpDen)===redDen();}
function simpNumOK(){const v=parseInt2(S.simpNum); return v!==null && v===redNum();}
function simpOK(){return simpDenOK()&&simpNumOK();}
function simpPartial(){
  const dv=parseInt2(S.simpDen), nv=parseInt2(S.simpNum);
  if(dv===null||nv===null||dv<=redDen()) return false;
  const g=S.p.num/dv;
  return Number.isInteger(g) && g>1 && nv===coefIn()/g;
}

/* how the cancelled pieces are marked right now */
function cCls(){ return S.phase==="cancel"+cs() ? "cancelling" : (past("cancel"+cs())?"struck":""); }
function kCls(){ return S.phase==="cancel"+ks() ? "cancelling" : (past("cancel"+ks())?"struck":""); }
function slashCls(){ return S.phase==="cancel"+ks() ? "slash draw" : (past("cancel"+ks())?"slash dim":""); }
function coefMoved(){return at("op"+ks());}     /* the coefficient move is on the page */
function coefLive(){return S.phase==="op"+ks();} /* ...and still being typed into */
function varSign(){
  const p=S.p;
  if(p.kind==="mul")  return p.a<0?-1:1;
  if(p.kind==="frac") return p.s<0?-1:1;
  return 1;                                     /* x/\u22123 keeps its sign under the bar */
}

/* ============ rendering pieces ============ */
function boxHTML(id,val,extra){
  return '<input id="'+id+'" class="box'+(extra||"")+'" value="'+esc(val)
       + '" autocomplete="off" spellcheck="false" inputmode="text">';
}
function cell(html,cls){return '<div class="cell '+(cls||"")+'">'+html+'</div>';}
function wideCell(html,cls){return '<div class="cell span2 '+(cls||"")+'">'+html+'</div>';}
function dfrac(t,b,cls){
  return '<span class="dfrac '+(cls||"")+'"><span class="t">'+t+'</span>'
       + '<span class="bar"></span><span class="b">'+b+'</span></span>';
}
function mgroup(mult,inner,tall,cls){
  return '<span class="mgroup'+(tall?" tall":"")+' '+(cls||"")+'">'+mult
       + '<span class="paren">(</span>'+inner+'<span class="paren">)</span></span>';
}
function tpair(a,b){ return '<span class="tpair">'+a+b+'</span>'; }
function markK(v){
  const c=kCls();
  return c ? '<span class="'+c+'">'+dash(String(v))+'</span>' : dash(String(v));
}
function coefFracHTML(){const p=S.p; return (p.s<0?MINUS:"")+dfrac(p.num,p.den);}
function recipHTML(marked){
  const p=S.p, inner=(p.s<0?MINUS:"")+dfrac(p.den,p.num);
  return marked ? '<span class="'+slashCls()+'">'+inner+'</span>' : inner;
}
function recipOK(){
  const p=S.p, n=parseInt2(S.recN), d=parseInt2(S.recD);
  if(n===null||d===null||n===0||d===0) return false;
  return Math.abs(n)===p.den && Math.abs(d)===p.num && ((n*d>0)===(p.s>0));
}
function fracboxHTML(nId,dId){
  const cls=" mini"+(recipOK()?" ok":"");
  return '<span class="fracbox">'+boxHTML(nId,S.recN,cls)
       + '<span class="bar"></span>'+boxHTML(dId,S.recD,cls)+'</span>';
}

/* live: the student is still filling the two small boxes in.
   otherwise the reduced numbers are just written in, and the strokes stay. */
function pendCls(ok,live){return live ? (ok?"slash draw":"pend") : "slash cross";}
function recipCancelHTML(live){
  const p=S.p;
  const den='<span class="cx below"><span id="slD" class="'+pendCls(simpDenOK(),live)+'">'+p.num+'</span>'
    + '<span class="redu">'
    + (live?boxHTML("sd",S.simpDen," tiny"+(simpDenOK()?" ok":"")):String(redDen()))
    + '</span></span>';
  return (p.s<0?MINUS:"")+dfrac(p.den,den);
}
function constCancelHTML(live){
  return '<span class="cx above"><span class="redu">'
    + (live?boxHTML("sn",S.simpNum," tiny"+(simpNumOK()?" ok":"")):dash(String(redNum())))
    + '</span><span id="slN" class="'+pendCls(simpNumOK(),live)+'">'
    + dash(String(coefIn()))+'</span></span>';
}

/* the variable term as written.  inline folds its sign in ( \u22123p );
   otherwise the sign is left to the caller, which is how 12 \u2212 3p is set.
   tm wraps the clickable pieces when it is time to pick what's in the way. */
function varTermHTML(inline,marked,tm){
  const p=S.p, V=p.V, c=kCls();
  tm = tm || plain;
  const mk=function(h){return (marked&&c) ? '<span class="'+c+'">'+h+'</span>' : h;};
  if(p.kind==="wrap") return dfrac(tm(V,"v")+tm(sgnHTML(p.k),"k"), tm(mk(String(p.a)),"a"));
  if(p.kind==="mul")  return tpair(tm(mk(inline?dash(String(p.a)):String(Math.abs(p.a))),"a"), tm(V,"v"));
  if(p.kind==="div")  return dfrac(tm(V,"v"), tm(mk(dash(String(p.a))),"a"));
  const f=(inline&&p.s<0?MINUS:"")+dfrac(p.num,p.den);
  return tpair(tm(marked ? '<span class="'+slashCls()+'">'+f+'</span>' : f,"a"), tm(V,"v"));
}

/* the second move, written on both sides of whatever line it lands on */
function coefApply(t,n){
  const p=S.p, live=coefLive();
  if(p.kind==="mul"){
    return [dfrac(t, live?boxHTML("kA",S.coefIn,""):markK(p.a), "grow"),
            dfrac(n, live?boxHTML("kB",S.coefIn,""):dash(String(p.a)), "grow")];
  }
  if(p.kind==="frac"){
    const vSide = mgroup(live?fracboxHTML("nA","dA"):recipHTML(true), t, true, "fade");
    /* once the coefficient is gone, the number side is a fraction times a number.
       If they share a factor, cancel it there before multiplying. */
    const nSide = (canSimp() && at(simpPhase()))
      ? mgroup(recipCancelHTML(simplifying()), constCancelHTML(simplifying()), true, "roomy")
      : mgroup(live?fracboxHTML("nB","dB"):recipHTML(false), n, true, "fade");
    return [vSide, nSide];
  }
  return [mgroup(live?boxHTML("kA",S.coefIn,""):markK(p.a), t, true,  "fade"),
          mgroup(live?boxHTML("kB",S.coefIn,""):dash(String(p.a)), n, false, "fade")];
}

/* ============ the equation ============ */
function order(t1,t2,eq,n){ return S.p.varLeft ? t1+t2+eq+n : n+eq+t1+t2; }

function normalRows(){
  const p=S.p, rows=[];
  const EQ=cell("=","eqsign"), BLANK=cell("","hide"), NOEQ=cell("","");
  const m1=marker(1);

  /* line 1 — the problem as given */
  const cBlue = S.phase==="compute1" ? "blue" : "";
  const cHTML = m1(dash(String(p.C)),"c");
  if(p.varFirst){
    rows.push(order(cell(varTermHTML(true,false,m1)), cell(m1(sgnHTML(p.k),"k"),cCls()),
                    EQ, cell(cHTML,cBlue)));
  } else {
    rows.push(order(cell(m1(dash(String(p.k)),"k"),cCls()),
                    cell('<span class="sgn">'+(varSign()<0?MINUS:"+")+'</span>'+varTermHTML(false,false,m1)),
                    EQ, cell(cHTML,cBlue)));
  }

  /* line 2 — the same move on both sides */
  if(at("op1")){
    const live=S.phase==="op1";
    const g='<span class="sgn">'+(S.sign<0?MINUS:"+")+'</span>';
    const vSide = live ? g+boxHTML("cA",S.opIn,"") : sgnHTML(-p.k);
    const nSide = live ? g+boxHTML("cB",S.opIn,"") : sgnHTML(-p.k);
    rows.push(p.varFirst
      ? order(BLANK, cell(vSide,cCls()+" blue"), NOEQ, cell(nSide,"blue"))
      : order(cell(vSide,cCls()+" blue"), BLANK, NOEQ, cell(nSide,"blue")));
    if(at("cancel1")) rows.push('<div class="rule"></div>');
  }

  /* line 3 — what is left, and then the second move written over it */
  if(at("compute1")){
    const m2=marker(2);
    let v=varTermHTML(true,coefMoved(),m2);
    let n=S.phase==="compute1" ? boxHTML("mv",S.mIn,"") : m2(dash(String(p.M)),"c");
    if(coefMoved()){ const r=coefApply(v,n); v=r[0]; n=r[1]; }
    const nCls = (S.phase==="compute2"||simplifying()) ? "blue" : "";
    rows.push(p.varFirst ? order(cell(v),BLANK,EQ,cell(n,nCls))
                         : order(BLANK,cell(v),EQ,cell(n,nCls)));
  }

  /* line 4 — the answer */
  if(at("compute2")){
    rows.push('<div class="spacer"></div>');
    const ans = S.phase==="compute2" ? boxHTML("ans",S.ansIn,"")
              : '<span class="green">'+dash(String(p.sol))+'</span>';
    const vc = cell('<span class="'+(at("solved")?"green":"")+'">'+p.V+'</span>');
    rows.push(p.varFirst ? order(vc,BLANK,EQ,cell(ans)) : order(BLANK,vc,EQ,cell(ans)));
  }
  return rows;
}

function wrappedRows(){
  const p=S.p, rows=[];
  const EQ=cell("=","eqsign"), BLANK=cell("","hide"), NOEQ=cell("","");
  const m1=marker(1);

  /* line 1 — the whole side sits over a, so that has to go first */
  let v=varTermHTML(true,coefMoved(),m1), n=m1(dash(String(p.C)),"c");
  if(coefMoved()){ const r=coefApply(v,n); v=r[0]; n=r[1]; }
  const nCls = S.phase==="compute1" ? "blue" : "";
  rows.push(p.varLeft ? wideCell(v)+EQ+cell(n,nCls) : cell(n,nCls)+EQ+wideCell(v));

  /* line 2 — now an ordinary one-step problem */
  if(at("compute1")){
    const m2=marker(2);
    rows.push('<div class="spacer"></div>');
    const mHTML = S.phase==="compute1" ? boxHTML("mv",S.mIn,"") : m2(dash(String(p.M)),"c");
    rows.push(order(cell(m2(p.V,"v")), cell(m2(sgnHTML(p.k),"k"),cCls()), EQ,
                    cell(mHTML, S.phase==="compute2"?"blue":"")));
  }

  /* line 3 — the same move on both sides */
  if(at("op2")){
    const live=S.phase==="op2";
    const g='<span class="sgn">'+(S.sign<0?MINUS:"+")+'</span>';
    const vSide = live ? g+boxHTML("cA",S.opIn,"") : sgnHTML(-p.k);
    const nSide = live ? g+boxHTML("cB",S.opIn,"") : sgnHTML(-p.k);
    rows.push(order(BLANK, cell(vSide,cCls()+" blue"), NOEQ, cell(nSide,"blue")));
    if(at("cancel2")) rows.push('<div class="rule"></div>');
  }

  /* line 4 — the answer */
  if(at("compute2")){
    const ans = S.phase==="compute2" ? boxHTML("ans",S.ansIn,"")
              : '<span class="green">'+dash(String(p.sol))+'</span>';
    rows.push(order(cell('<span class="'+(at("solved")?"green":"")+'">'+p.V+'</span>'),
                    BLANK, EQ, cell(ans)));
  }
  return rows;
}

function renderEquation(){
  document.getElementById("eq").innerHTML = (S.p.wrapped?wrappedRows():normalRows()).join("");
}

/* ============ the panel ============ */
function sideHTML(inner){                        /* the variable side, with `inner` for V */
  const p=S.p;
  if(p.kind==="wrap") return dfrac(inner+sgnHTML(p.k), String(p.a));
  if(p.varFirst){
    const t = p.kind==="mul" ? dash(String(p.a))+inner
            : p.kind==="div" ? dfrac(inner,dash(String(p.a)))
            : (p.s<0?MINUS:"")+dfrac(p.num,p.den)+inner;
    return t+' '+sgnHTML(p.k);
  }
  const t = p.kind==="mul" ? String(Math.abs(p.a))+inner
          : p.kind==="div" ? dfrac(inner,dash(String(p.a)))
          : dfrac(p.num,p.den)+inner;
  return dash(String(p.k))+' <span class="sgn">'+(varSign()<0?MINUS:"+")+'</span>'+t;
}
function checkLineHTML(){
  const p=S.p;
  const solG='<span class="green">'+dash(String(p.sol))+'</span>';
  const inner='<span class="paren">(</span>'+solG+'<span class="paren">)</span>';
  const C=dash(String(p.C)), eq=' <span class="eqsign">=</span> ';
  const tick=' <span class="green">&#10003;</span>';
  const o=sideHTML(p.V), s=sideHTML(inner);
  return '<div class="checkline"><div class="orig">'
    + (p.varLeft ? o+eq+C : C+eq+o) + '</div><div class="sub">'
    + (p.varLeft ? s+eq+C+tick : C+eq+s+tick) + '</div></div>';
}
function renderPanel(){
  const el=document.getElementById("panel");
  if(subName()==="pick"){ el.innerHTML=Shell.opsHTML(); return; }
  if(S.phase==="check"){ el.innerHTML=checkLineHTML(); return; }
  el.innerHTML="";
}

/* ============ the prompt ============ */
function renderPrompt(){
  const el=document.getElementById("promptbar"), p=S.p, V=p.V;
  const sub=subName(), konst=isConst();
  let h="";

  if(sub==="target"){
    h='<div class="prompt"><span>Click what we\'re trying to get rid of.</span></div>';
  }
  else if(sub==="pick"){
    h='<div class="prompt"><span>We need to do the <strong>opposite</strong>, or <strong>inverse</strong>, '
      + 'of this on <strong>both sides</strong>.</span>'
      + '<span class="faint">Click a button, or type A S M D (or + &minus; x /)</span></div>';
  }
  else if(sub==="op"){
    if(konst){
      h='<div class="prompt"><span>Now type how much you '+(S.sign<0?"subtract from":"add to")+' both sides.</span></div>';
    } else if(p.kind==="mul"){
      h='<div class="prompt"><span>Divide both sides by the number multiplying '+V+'.</span></div>';
    } else if(p.kind==="frac"){
      h='<div class="prompt"><span>Multiply both sides by the reciprocal of</span>'
        + '<span class="math">'+coefFracHTML()+'</span></div>';
    } else {
      h='<div class="prompt"><span>Multiply both sides by the number underneath '+V+'.</span></div>';
    }
  }
  else if(sub==="cancel"){
    if(konst){
      h='<div class="prompt"><span class="math">'+dash(String(p.k))+'</span><span>and</span>'
        + '<span class="math">'+sgnHTML(-p.k)+'</span><span>make zero, so they cancel'
        + (p.wrapped?' &mdash; leaving '+V+' alone':' &mdash; leaving the '+V+' term by itself')+'.</span></div>';
    } else if(p.kind==="frac"){
      h='<div class="prompt"><span class="math">'+recipHTML(false)+'</span><span>'+TIMES+'</span>'
        + '<span class="math">'+coefFracHTML()+'</span>'
        + '<span>makes 1, so the coefficient is gone &mdash; leaving '+V+' alone.</span></div>';
    } else {
      h='<div class="prompt"><span class="math">'+dash(String(p.a))+'</span><span>over</span>'
        + '<span class="math">'+dash(String(p.a))+'</span>'
        + '<span>makes 1, so they cancel &mdash; leaving '+V+(p.wrapped?' and the '+Math.abs(p.k)+' free of the fraction':' alone')
        + '.</span></div>';
    }
  }
  else if(sub==="simplify"){
    const M=coefIn();
    h='<div class="prompt"><span><strong>Simplify before you multiply.</strong> '
      + p.num+' and '+Math.abs(M)+' share a factor &mdash; divide them both by it.</span>';
    if(simpPartial()) h+='<div class="noteline">That is a common factor, but not the biggest one '
      + '&mdash; those two can still be cancelled further.</div>';
    h+='</div>';
  }
  else if(sub==="compute"){
    if(konst){
      h='<div class="prompt"><span>Combine the blue side:</span><span class="math blue">'
        + dash(String(constIn()))+' '+sgnHTML(-p.k)+'</span></div>';
    } else {
      const M=coefIn(), Md=dash(String(M));
      /* after cancelling, the numbers on the page are the small ones */
      const cut = (p.s<0?MINUS:"")+(redDen()>1?dfrac(p.den,redDen()):String(p.den))
                + ' '+TIMES+' '+dash(String(redNum()));
      const expr = p.kind==="mul"  ? Md+' '+DIV+' '+dash(String(p.a))
                 : p.kind==="frac" ? (canSimp() ? cut : recipHTML(false)+' '+TIMES+' '+Md)
                                   : dash(String(p.a))+' '+TIMES+' '+Md;
      h='<div class="prompt"><span>Now finish the other side:</span>'
        + '<span class="math blue">'+expr+'</span></div>';
    }
  }
  else if(S.phase==="solved"){
    h='<div class="prompt"><span class="green"><strong>That\'s '+V+'. Now check it.</strong></span></div>';
  }
  else if(S.phase==="check"){
    h='<div class="row-between"><div class="prompt"><span>Put</span><span class="math">'
      + dash(String(p.sol))+'</span><span>back in for '+V+' and both sides match.</span></div>'
      + '<button class="next" id="nextBtn">'+Shell.nextLabel()+'</button></div>';
  }
  if(S.miss) h+='<div class="missline">'+S.miss+'</div>';
  el.innerHTML=h;
}

/* ---- one size per problem, as big as the screen allows ----
   Before the first line is drawn, this problem is drawn off-screen in its two
   biggest states (every line of working plus the check, and the last set of
   operation buttons) and measured. It is then scaled up or down so that finished
   problem just fills the room, and the block keeps that height from the start,
   so new lines appear below without anything moving or resizing mid-solve. */
function lockScale(){
  const room=Shell.room();
  Shell.stageH=0; Shell.mainW=0; Shell.sideW=0;
  if(!room.h || !room.w){ Shell.scale=1; return; }
  const savePhase=S.phase, saveMiss=S.miss;
  const g=document.getElementById("ghost");
  let mw=0, mh=0, sw=0, sh=0, gap=0, row=true;
  [["check",false],["pick2",true]].forEach(function(st){
    S.phase=st[0]; S.miss="";
    g.innerHTML='<div class="stage"><div class="stage-main">'
      + '<div class="scroller"><div class="eq k-two">'
      + (S.p.wrapped?wrappedRows():normalRows()).join("")
      + '</div></div></div><div class="stage-side">'
      + '<div>'+(st[1]?Shell.opsHTML():checkLineHTML())+'</div></div></div>';
    const stage=g.firstChild, main=stage.children[0], side=stage.children[1];
    const cs=getComputedStyle(stage);
    row = cs.flexDirection==="row";
    gap = parseFloat(row?cs.columnGap:cs.rowGap)||0;
    mw=Math.max(mw,main.offsetWidth); mh=Math.max(mh,main.offsetHeight);
    sw=Math.max(sw,side.offsetWidth); sh=Math.max(sh,side.offsetHeight);
  });
  g.innerHTML="";
  S.phase=savePhase; S.miss=saveMiss;
  const w = row ? mw+gap+sw : Math.max(mw,sw);
  const h = row ? Math.max(mh,sh) : mh+gap+sh;
  if(!w || !h){ Shell.scale=1; return; }
  /* a little spare width for the click highlights on the first line */
  const raw=Math.min(room.w*0.95/w, room.h*0.97/h);
  /* a floor, so a very short window shrinks the writing only so far; a ceiling so a
     small problem on a huge screen doesn't turn into a billboard */
  Shell.scale=Math.min(Math.max(raw,0.5),2.4);
  Shell.stageH=h; Shell.mainW=mw; Shell.sideW=sw;
  document.querySelector(".work").style.overflowY = (raw < 0.5) ? "auto" : "hidden";
}

function render(){
  Shell.head(); renderEquation(); renderPanel(); renderPrompt(); attach();
  Shell.applyScale(); focusFirst();
}
function focusFirst(){
  later(60,function(){
    const el=S.firstId && document.getElementById(S.firstId);
    if(el && !el.readOnly) el.focus();
  });
}

/* ============ flow ============ */
function setPhase(ph){
  clearTimers();
  S.phase=ph; S.miss="";
  S.firstId = ph==="op"+cs()   ? "cA"
            : ph==="op"+ks()   ? (S.p.kind==="frac" ? (parseInt2(S.recN)===null?"nA":"dA") : "kA")
            : ph===simpPhase() ? "sd"
            : ph==="compute1"  ? "mv"
            : ph==="compute2"  ? "ans" : null;
  render();
  if(ph==="cancel1") later(1700,function(){ setPhase(afterCancel(1)); });
  if(ph==="cancel2") later(1750,function(){ setPhase(afterCancel(2)); });
  if(ph==="solved")  later(850, function(){ setPhase("check"); });
}
/* the coefficient step gets a cancelling stop first when there is one to make */
function afterCancel(step){
  return (step===ks() && canSimp()) ? "simplify"+step : "compute"+step;
}
/* plain-text version of the problem and answer, for the turn-in log */
function describe(){
  const p=S.p, V=p.V;
  const pm=function(n){ return (n<0?MINUS:"+")+" "+Math.abs(n); };
  let side;
  if(p.kind==="wrap") side="("+V+" "+pm(p.k)+")/"+p.a;
  else {
    let lead, bare;
    if(p.kind==="mul"){ lead=dash(String(p.a))+V; bare=Math.abs(p.a)+V; }
    else if(p.kind==="div"){ lead=V+"/"+dash(String(p.a)); bare=lead; }
    else { bare="("+p.num+"/"+p.den+")"+V; lead=(p.s<0?MINUS:"")+bare; }
    side = p.varFirst ? lead+" "+pm(p.k)
                      : dash(String(p.k))+" "+(varSign()<0?MINUS:"+")+" "+bare;
  }
  const C=dash(String(p.C));
  return {q: p.varLeft ? side+" = "+C : C+" = "+side, a: V+" = "+dash(String(p.sol))};
}
function finish(){ Shell.solved(S.clean, describe()); setPhase("solved"); }
function flagMiss(msg){
  S.clean=false; S.miss=msg; renderPrompt(); attach();
  later(3000,function(){ S.miss=""; renderPrompt(); attach(); });
}
function missMessage(){
  const sub=subName();
  if(sub==="op") return isConst()
    ? "That won't cancel it out \u2014 use the same size number that's in the way."
    : (S.p.kind==="frac" ? "Not quite \u2014 flip the fraction over, and keep the sign in mind."
                         : "Not quite \u2014 check the number and its sign, then try again.");
  if(sub==="simplify") return "Divide both numbers by the same factor, then write what each one becomes.";
  if(sub==="compute") return "Not quite \u2014 check the size and the sign, then try again.";
  return "";
}
function nextProblem(){ Shell.next(); }
function begin(fl){
  clearTimers();
  S.fl = fl || "basic";
  S.p = genProblem(S.fl);
  S.phase="target1"; S.sign=1;
  S.opIn=""; S.coefIn=""; S.recN=""; S.recD=""; S.mIn=""; S.ansIn="";
  S.simpDen=""; S.simpNum="";
  S.hint=false; S.clean=true; S.miss=""; S.firstId=null;
  lockScale();
  render();
}
/* back from the turn-in page mid-problem: pick up where it left off */
function resume(){ if(S.p) setPhase(S.phase); }
/* if the window changes size, work the one size out again for the problem in hand */
Shell.onResize=function(){
  if(Shell.activeEng!==KEY || !S.p) return;
  lockScale(); Shell.applyScale();
};

/* ============ input handling ============ */
function attach(){
  const nb=document.getElementById("nextBtn"); if(nb) nb.onclick=nextProblem;
  Shell.bindOps(chooseOp);
  Shell.bindTargets(chooseTarget);

  bind("cA",onConst); bind("cB",onConst);
  bind("kA",onCoef);  bind("kB",onCoef);
  bind("nA",onRecN);  bind("nB",onRecN);
  bind("dA",onRecD);  bind("dB",onRecD);
  bind("sd",onSimpDen); bind("sn",onSimpNum);
  bind("mv",onMid);   bind("ans",onAns);
}
function bind(id,handler){
  const el=document.getElementById(id);
  if(!el) return;
  el.oninput=handler;
  el.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); flagMiss(missMessage()); } };
}
function mirror(ids,val){
  ids.forEach(function(id){
    const b=document.getElementById(id);
    if(b && b.value!==val) b.value=val;
  });
}

/* ---- first: click what's in the way ---- */
function targetMsg(id){
  const p=S.p, V=p.V;
  if(id==="v") return "That's "+V+" \u2014 that's what we want to keep. Click what's in its way.";
  if(id==="c") return "That number is already by itself on the other side. Click what's in "+V+"'s way.";
  if(id==="a") return "That one is stuck to "+V+", so it comes off last. Clear the loose "
    + Math.abs(p.k)+" first.";
  if(id==="k") return "Not yet \u2014 the whole side is divided by "+p.a+", so the "+Math.abs(p.k)
    + " isn't loose. Clear the "+p.a+" underneath first.";
  return "";
}
function chooseTarget(id,el){
  const step = S.phase==="target1" ? 1 : 2;
  if(id===wantT(step)){ S.hint=false; setPhase("pick"+step); return; }
  S.clean=false; Shell.shake(el); flagMiss(targetMsg(id));
}

/* ---- then: pick the opposite move ---- */
function wantOp(step){
  const p=S.p;
  if(step===cs()) return p.k>0 ? "sub" : "add";
  return p.kind==="mul" ? "divide" : "multiply";
}
function wrongOpMsg(step,pressed){
  const p=S.p, V=p.V;
  if(step===cs()){
    if(pressed==="add"||pressed==="sub")
      return "That moves the wrong way \u2014 it makes that side bigger instead of clearing the "
        + (p.k<0?"subtraction":"addition")+".";
    return "Nothing is multiplying or dividing that "+Math.abs(p.k)+" \u2014 it is being "
      + (p.k<0?"subtracted":"added")+", so undo it the same way.";
  }
  if(pressed==="add"||pressed==="sub"){
    if(p.wrapped) return "Careful \u2014 the whole side is over "+p.a+", so nothing is loose yet. "
      + "Undo the division first.";
    return "Nothing is being added here \u2014 "+V+" is "
      + (p.kind==="mul"  ? "multiplied by "+dash(String(p.a))
       : p.kind==="frac" ? "multiplied by a fraction"
                         : "divided by "+dash(String(p.a)))
      + ", so adding or subtracting won't free it.";
  }
  return p.kind==="mul"
    ? "That side is already a multiplication \u2014 multiplying again won't free "+V+"."
    : (p.kind==="frac"
       ? "Dividing by a fraction is the hard way \u2014 flipping it over and multiplying does the "
         + "same job. Press ( )."
       : V+" is already being divided \u2014 dividing again won't free it.");
}
function chooseOp(kind,btn){
  const step = S.phase==="pick1" ? 1 : 2;
  if(kind===wantOp(step)){
    if(step===cs()){ S.sign = kind==="sub" ? -1 : 1; S.opIn=""; }
    else { S.coefIn=""; S.recN=""; S.recD=""; S.simpDen=""; S.simpNum=""; }
    S.hint=false; setPhase("op"+step);
    return;
  }
  S.clean=false; Shell.shake(btn);
  flagMiss(wrongOpMsg(step,kind));
}

function paint(ids,ok,base){
  const cls=base+(ok?" ok":"");
  ids.forEach(function(id){ const b=document.getElementById(id); if(b) b.className=cls; });
}
function onConst(e){
  S.opIn=e.target.value; mirror(["cA","cB"],S.opIn);
  const v=parseInt2(S.opIn), ok=(v!==null && Math.abs(v)===Math.abs(S.p.k));
  paint(["cA","cB"],ok,"box");
  clearTimers();
  if(ok) later(300,function(){ S.hint=false; setPhase("cancel"+cs()); });
}
function onCoef(e){
  S.coefIn=e.target.value; mirror(["kA","kB"],S.coefIn);
  const v=parseInt2(S.coefIn), ok=(v!==null && v===S.p.a);
  paint(["kA","kB"],ok,"box");
  clearTimers();
  if(ok) later(300,function(){ S.hint=false; setPhase("cancel"+ks()); });
}
function onRecN(e){
  S.recN=e.target.value; mirror(["nA","nB"],S.recN);
  paint(["nA","nB","dA","dB"],recipOK(),"box mini");
  clearTimers();
  if(recipOK()){ later(320,function(){ S.hint=false; setPhase("cancel"+ks()); }); return; }
  const n=parseInt2(S.recN);
  if(n!==null && Math.abs(n)===S.p.den && parseInt2(S.recD)===null){
    const d=document.getElementById(e.target.id==="nA"?"dA":"dB");
    if(d) d.focus();
  }
}
function onRecD(e){
  S.recD=e.target.value; mirror(["dA","dB"],S.recD);
  paint(["nA","nB","dA","dB"],recipOK(),"box mini");
  clearTimers();
  if(recipOK()) later(320,function(){ S.hint=false; setPhase("cancel"+ks()); });
}
function setCls(el,cls){ if(el && el.className!==cls) el.className=cls; }
function paintSimp(){
  if(!simplifying()) return;
  setCls(document.getElementById("sd"),"box tiny"+(simpDenOK()?" ok":""));
  setCls(document.getElementById("sn"),"box tiny"+(simpNumOK()?" ok":""));
  setCls(document.getElementById("slD"),pendCls(simpDenOK(),true));
  setCls(document.getElementById("slN"),pendCls(simpNumOK(),true));
  renderPrompt(); attach();
}
function onSimpDen(e){
  S.simpDen=e.target.value;
  paintSimp(); clearTimers();
  if(simpOK()){ later(420,function(){ S.hint=false; setPhase("compute"+ks()); }); return; }
  if(simpDenOK() && parseInt2(S.simpNum)===null){
    const sn=document.getElementById("sn"); if(sn) sn.focus();
  }
}
function onSimpNum(e){
  S.simpNum=e.target.value;
  paintSimp(); clearTimers();
  if(simpOK()) later(420,function(){ S.hint=false; setPhase("compute"+ks()); });
}
function onMid(e){
  S.mIn=e.target.value;
  const v=parseInt2(S.mIn);
  clearTimers();
  if(v!==null && v===S.p.M) later(300,function(){ S.hint=false; setPhase("target2"); });
}
function onAns(e){
  S.ansIn=e.target.value;
  const v=parseInt2(S.ansIn);
  clearTimers();
  if(v!==null && v===S.p.sol) later(280,finish);
}

document.addEventListener("keydown",function(e){
  if(Shell.activeEng!==KEY) return;
  if(e.key==="Enter" && S.phase==="check") nextProblem();
});

return {start:begin, resume:resume};

})();

/* ============================================================
   Turning it in
   ------------------------------------------------------------
   10 problems get turned in. After the 10th the turn-in page
   comes up; after that, practice keeps going. The Turn in button
   opens the same page any time, so a student who runs out of
   time can send what they have (the newer send counts).
   ============================================================ */
const GOAL = 10;
const DRILL_NAME = "Two-Step Equations";
const byId = function(id){ return document.getElementById(id); };
const escHtml = function(t){ return String(t).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };

const TI = {
  records:[], served:0, currentDone:false, autoShown:false, submitted:false, submittedAt:0,

  isOpen:function(){ return !byId("turnin").classList.contains("off"); },
  clean:function(){ return TI.records.filter(function(r){ return r.clean; }).length; },
  record:function(clean,info){
    if(TI.currentDone) return;
    TI.currentDone = true;
    info = info || {q:"",a:""};
    TI.records.push({q:info.q, a:info.a, clean:!!clean});
  },
  /* after the 10th, the Next button becomes the way to the turn-in page */
  nextLabel:function(){
    return (TI.records.length >= GOAL && !TI.autoShown) ? "Turn in my work &rarr;" : "Next problem &rarr;";
  },
  wantsTurnIn:function(){
    if(TI.records.length >= GOAL && !TI.autoShown){ TI.autoShown = true; return true; }
    return false;
  },
  newProblem:function(){
    TI.served++;
    TI.currentDone = false;
    byId("problem-title").textContent = TI.served <= GOAL
      ? "Problem " + TI.served + " of " + GOAL
      : "Problem " + TI.served + " \u00b7 extra practice";
  },

  show:function(){
    const done = TI.records.length, clean = TI.clean();
    if(done >= GOAL){
      byId("ti-title").textContent = done > GOAL ? done + " problems done" : "All " + GOAL + " done";
      byId("ti-after-lab").textContent = "Want more practice?";
      byId("ti-back").textContent = "Keep practicing";
    } else {
      byId("ti-title").textContent = "Turn in your work so far";
      byId("ti-after-lab").textContent = "Not done yet?";
      byId("ti-back").textContent = "Go back and keep working";
    }
    byId("ti-recap").innerHTML =
        "<div>Problems<b>" + done + "</b></div>"
      + "<div>Right the first time<b>" + clean + "</b></div>"
      + "<div>Needed a retry<b>" + (done - clean) + "</b></div>";
    byId("ti-log").innerHTML = done
      ? '<div class="ti-log">' + TI.records.map(function(r,i){
          return '<div class="ti-row"><span class="ti-n">' + (i+1) + '.</span>'
            + '<span class="ti-q">' + escHtml(r.q) + '<span class="ti-arrow">&rarr;</span>' + escHtml(r.a) + '</span>'
            + '<span class="ti-k' + (r.clean ? '' : ' retry') + '">' + (r.clean ? 'first try' : 'retry') + '</span></div>';
        }).join("") + '</div>'
      : '<div class="ti-empty">Nothing finished yet \u2014 finished problems show up here.</div>';

    const more = TI.submitted && done > TI.submittedAt;
    byId("gform").classList.toggle("off", TI.submitted && !more);
    if(more){
      byId("ti-feedback").innerHTML = '<span class="note">You turned in ' + TI.submittedAt + ' \u2014 you have ' + done + ' now. '
        + 'Send it again and the newer one counts.</span>';
      byId("ti-submit").textContent = "Send updated results";
    } else if(!TI.submitted){
      byId("ti-feedback").innerHTML = "";
      byId("ti-submit").textContent = "Submit Results";
    }
    byId("formScore").value = done;

    Shell.clearTimers();
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    byId("turnin").classList.remove("off");
    byId("turnin").scrollTop = 0;
    if(!TI.submitted || more) setTimeout(function(){ byId(TI.submitted ? "ti-submit" : "studentPeriod").focus(); }, 50);
  },

  /* back to the drill: a finished problem moves on, a half-done one is left right where it was */
  back:function(){
    byId("turnin").classList.add("off");
    if(TI.currentDone && (TI.records.length !== GOAL || TI.autoShown)){
      if(TI.records.length >= GOAL) TI.autoShown = true;
      Shell.next();
    } else {
      const eng = Shell.engines[Shell.activeEng];
      if(eng && eng.resume) eng.resume();
      const el = document.querySelector("#eq input, #panel input, #nextBtn");
      if(el) el.focus();
    }
  }
};

function onHiddenFrameLoad(){
  if(!TI.submitted) return;
  byId("ti-feedback").innerHTML = '<span class="ok">Successfully submitted. '
    + (TI.records.length >= GOAL
        ? 'You can close this page, or keep practicing.'
        : 'You can close this page, or go back and keep working.')
    + '</span>';
  byId("gform").classList.add("off");
}

function nameCheck(){
  const ln = byId("lastName").value.trim(), fn = byId("firstName").value.trim();
  const row = function(t,v){ return '<div class="row"><span class="t">' + t + '</span>'
    + '<span class="v' + (v ? '' : ' empty') + '">' + (v ? escHtml(v) : '\u2014') + '</span></div>'; };
  byId("nameCheck").innerHTML =
      '<div class="head">This is what will be sent \u2014 check it is the right way round:</div>'
    + row("Last name", ln) + row("First name", fn) + row("Roll call", ln && fn ? ln + ", " + fn : "");
}
["lastName","firstName"].forEach(function(id){ byId(id).addEventListener("input", nameCheck); });
nameCheck();

byId("gform").addEventListener("submit", function(){
  const ln = byId("lastName").value.trim(), fn = byId("firstName").value.trim();
  byId("studentName").value =
      "Period " + byId("studentPeriod").value.trim() + " \u2014 " + ln + " \u2014 " + fn
    + " \u2014 " + TI.clean() + " clean solves \u2014 " + DRILL_NAME + " (" + TI.records.length + " problems)";
  byId("formScore").value = TI.records.length;
  TI.submitted = true;
  TI.submittedAt = TI.records.length;
});
byId("ti-back").addEventListener("click", TI.back);
byId("turnin-link").addEventListener("click", TI.show);

Shell.next();
</script>
